substitutions:
  name: jsdsolar
  device_description: "JSDSolar 6KHB D1/LV ECO Inverter"
  cat1: "[DI]"
  cat2: "[RTD]"
  cat3: "[HPP]"
  cat4: "[HPVP]"
  tx_pin: GPIO22
  rx_pin: GPIO21

esphome:
  name: ${name}
  comment: ${device_description}
  min_version:  2026.4.0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome    
    password: !secret ota_password

esp32:
  #board: wemos_d1_mini32
  board: esp32dev
  framework:
    type: esp-idf
#esp32:
  #board: esp32-s3-devkitc-1
  #variant: ESP32S3
  #flash_size: 16MB
  #framework:
  #  type: arduino
#    version: 2.0.4
#  framework:
#    type: esp-idf
#    sdkconfig_options:
#      CONFIG_ESP32_S3_BOX_BOARD: "y"



wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  #version: 3
  #auth:
  #  username: !secret web_server_username
  #  password: !secret web_server_password  

logger:
  level: DEBUG
  #3level: DEBUG
  
# Set pins required for LilyGo T-CAN485 board comment out if using different board
output:
  - platform: gpio
    id: ENABLE_PIN # Enable the chip
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN # Enable autodirection
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN # Enable 5V pin for RS485 chip
    pin:
      number: GPIO16
      inverted: true

# =========================
# UART / MODBUS
# =========================
uart:
  id: uart_modbus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600

modbus:
  id: modbus1
  uart_id: uart_modbus
  send_wait_time: 200ms

modbus_controller:
  - id: inverter_modbus
    address: 1
    modbus_id: modbus1
    update_interval: 30s
    #setup_priority: -10
    #command_throttle: 10ms

button:
# =========================
#  Generator work time control
# =========================
  - platform: template
    id: t_generator_time_z_read_button
    name: "${cat3} T Generator Time Z Read Button"
    on_press:
      then:
        - lambda: |-
            std::string valueStr = id(generator_start_time).state;
            valueStr.append(":00");
            auto call1 = id(t_generator_start_time_setter).make_call();
            call1.set_time(valueStr);
            call1.perform();
            valueStr = id(generator_end_time).state;
            valueStr.append(":00");
            auto call2 = id(t_generator_end_time_setter).make_call();
            call2.set_time(valueStr);
            call2.perform();

  - platform: template
    id: t_generator_time_z_write_button
    name: "${cat3} T Generator Time Z Write Button"
    on_press:
      then:
        - lambda: |-
            std::string valueStr = id(generator_start_time).state;
            ESP_LOGD("main", "G Old Start Time: %s", valueStr.c_str());
            if(valueStr.length() > 3) {
              valueStr.erase(2,1);
              uint16_t value = modbus::helpers::word_from_hex_str(valueStr, 0);
              uint16_t new_value = id(t_generator_start_time_setter).hour * 256 + id(t_generator_start_time_setter).minute;
               ESP_LOGD("main", "G New Start Time: %d : %d", id(t_generator_start_time_setter).hour, id(t_generator_start_time_setter).minute);
              if(value != new_value) {              
                esphome::modbus_controller::ModbusCommandItem set_payload_command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_modbus, 0x2154, new_value);
                inverter_modbus->queue_command(set_payload_command);
                ESP_LOGD("main", "Updated Start ##########################################################");
              }
            } 
            valueStr = id(generator_end_time).state;
            ESP_LOGD("main", "G Old Start Time: %s", valueStr.c_str());
            if(valueStr.length() > 3) {
              valueStr.erase(2,1);
              uint16_t value = modbus::helpers::word_from_hex_str(valueStr, 0);
              uint16_t new_value = id(t_generator_end_time_setter).hour * 256 + id(t_generator_end_time_setter).minute;
               ESP_LOGD("main", "G New Start Time: %d : %d", id(t_generator_start_time_setter).hour, id(t_generator_start_time_setter).minute);
              if(value != new_value) {              
                esphome::modbus_controller::ModbusCommandItem set_payload_command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_modbus, 0x2155, new_value);
                inverter_modbus->queue_command(set_payload_command);
                ESP_LOGD("main", "Updated End ##########################################################");
              }
            } 
  
  - platform: template
    id: t_time_based_control_z_read_button
    name: "${cat3} T Time Based Control Z Read Button"
    on_press:
      then:
        - lambda: |-
            ESP_LOGD("main", "###################### T Mode: %s", id(time_based_control_structure).state.c_str());

            std::string valueStr = id(time_based_control_structure).state;
            uint16_t id = atoi(id(t_time_based_control_id_setter).current_option().c_str());
            uint16_t posStr = (id-1)*32;
            uint16_t posHex = (id-1)*16;
            
            uint16_t controls = modbus::helpers::word_from_hex_str(valueStr, posHex);
            ESP_LOGD("main", "###################### T Time Based Controls: 0x%x", controls);
            std::string startTimeStr = valueStr.substr((posStr + 4), 4);
            ESP_LOGD("main", "###################### T Time Based Start Time: %s", startTimeStr.c_str());
            std::string endTimeStr = valueStr.substr((posStr + 8), 4);
            ESP_LOGD("main", "###################### T Time Based End Time Time: %s", endTimeStr.c_str());
            uint32_t power = modbus::helpers::dword_from_hex_str(valueStr, (posHex + 6));
            ESP_LOGD("main", "###################### T Time Based Power: 0x%x", power);
            uint16_t endSOC = modbus::helpers::word_from_hex_str(valueStr, (posHex + 10));
            ESP_LOGD("main", "###################### T Time Based End SOC: 0x%x", endSOC);
            uint16_t endBattery = modbus::helpers::word_from_hex_str(valueStr, (posHex + 12));
            ESP_LOGD("main", "###################### T Time Based End Battery: 0x%x", endBattery);
            uint16_t date = modbus::helpers::word_from_hex_str(valueStr, (posHex + 14));
            ESP_LOGD("main", "###################### T Time Based Date: 0x%x", date);
            
            if((controls & 0b11) == 0b00) {
              id(t_time_based_control_mode_setter).publish_state((size_t)0);
            } else if((controls & 0b11) == 0b01) {
              id(t_time_based_control_mode_setter).publish_state((size_t)1);
            } else if((controls & 0b11) == 0b10) {
              id(t_time_based_control_mode_setter).publish_state((size_t)2);
            } else {
              id(t_time_based_control_mode_setter).publish_state((size_t)3);
              ESP_LOGD("main", "###################### T Time Based Mode Unknown: 0x%x", (controls & 0b11));
            }            
            
            if((controls & 0b100) > 0) {
              id(t_time_based_control_repeat_setter).publish_state((size_t)1);
            } else if((controls & 0b100) == 0) {
              id(t_time_based_control_repeat_setter).publish_state((size_t)0);
            } else {
              id(t_time_based_control_repeat_setter).publish_state((size_t)2);
            }            
            
            if((controls & 0b10000) > 0) {
              id(t_time_based_control_weekly_monday).turn_on();
            } else {
              id(t_time_based_control_weekly_monday).turn_off();
            }
            if((controls & 0b100000) > 0) {
              id(t_time_based_control_weekly_tuesday).turn_on();
            } else {
              id(t_time_based_control_weekly_tuesday).turn_off();
            }
            if((controls & 0b1000000) > 0) {
              id(t_time_based_control_weekly_wednesday).turn_on();
            } else {
              id(t_time_based_control_weekly_wednesday).turn_off();
            }
            if((controls & 0b10000000) > 0) {
              id(t_time_based_control_weekly_thursday).turn_on();
            } else {
              id(t_time_based_control_weekly_thursday).turn_off();
            }
            if((controls & 0b100000000) > 0) {
              id(t_time_based_control_weekly_friday).turn_on();
            } else {
              id(t_time_based_control_weekly_friday).turn_off();
            }
            if((controls & 0b1000000000) > 0) {
              id(t_time_based_control_weekly_saturday).turn_on();
            } else {
              id(t_time_based_control_weekly_saturday).turn_off();
            }
            if((controls & 0b10000000000) > 0) {
              id(t_time_based_control_weekly_sunday).turn_on();
            } else {
              id(t_time_based_control_weekly_sunday).turn_off();
            }
            
            startTimeStr.insert(2, ":");
            startTimeStr.append(":00");
            auto call1 = id(t_time_based_control_start_time_setter).make_call();
            call1.set_time(startTimeStr);
            call1.perform();
            endTimeStr.insert(2, ":");
            endTimeStr.append(":00");
            auto call2 = id(t_time_based_control_end_time_setter).make_call();
            call2.set_time(endTimeStr);
            call2.perform();

            id(t_time_based_control_power_setter).publish_state((float)power);
            id(t_time_based_control_end_soc_setter).publish_state((float)endSOC);
            id(t_time_based_control_end_battery_voltage_setter).publish_state(((float)endBattery)/10);
            uint16_t year = (date >> 9) & 0b111111;
            uint16_t month = (date >> 5) & 0b1111;
            uint16_t day = (date) & 0b11111;
            std::string dateStr = "";
            dateStr.append(std::to_string(year+2020).c_str());
            dateStr.append("-");
            std::string monthStr = std::to_string(month);
            if(monthStr.length() == 1) {
              dateStr.append("0");
            } 
            dateStr.append(monthStr);
            dateStr.append("-");
            std::string dayStr = std::to_string(day);
            if(dayStr.length() == 1) {
              dateStr.append("0");
            } 
            dateStr.append(dayStr);
            ESP_LOGD("main", "###################### T Time Based Date Str: %s", dateStr.c_str());
            auto call5 = id(t_time_based_control_date_setter).make_call();
            call5.set_date(dateStr);
            call5.perform();


  - platform: template
    id: t_time_based_control_z_write_button
    name: "${cat3} T Time Based Control Z Write Button"
    on_press:
      then:
        - lambda: |-
            uint16_t id = atoi(id(t_time_based_control_id_setter).current_option().c_str());
            uint16_t pos = (id-1)*8;
            
            int16_t controls = 0b0000000000000000;
            std::string modeStr = id(t_time_based_control_mode_setter).current_option();
            if(modeStr.compare("Disable (0)") == 0) {
              controls |= 0b00;
            } else if(modeStr.compare("Charge (1)") == 0) {
              controls |= 0b01;
            } else if(modeStr.compare("Discharge (2)") == 0) {
              controls |= 0b10;
            } else {
              controls |= 0b11;
            }

            modeStr = id(t_time_based_control_repeat_setter).current_option();
            if(modeStr.compare("Once (0)") == 0) {
              controls |= 0b0000;
            } else if(modeStr.compare("Weekly (1)") == 0) {
              controls |= 0b0100;
            } else {
              controls |= 0b1100;
            }

            if(id(t_time_based_control_weekly_monday).state) {
              controls |= 0b10000;
            }
            if(id(t_time_based_control_weekly_tuesday).state) {
              controls |= 0b100000;
            }
            if(id(t_time_based_control_weekly_wednesday).state) {
              controls |= 0b1000000;
            }
            if(id(t_time_based_control_weekly_thursday).state) {
              controls |= 0b10000000;
            }
            if(id(t_time_based_control_weekly_friday).state) {
              controls |= 0b100000000;
            }
            if(id(t_time_based_control_weekly_saturday).state) {
              controls |= 0b1000000000;
            }
             if(id(t_time_based_control_weekly_sunday).state) {
              controls |= 0b10000000000;
            }
            ESP_LOGD("main", "###################### T Time Based Controls: 0x%x", controls);
            uint16_t newStartTime = id(t_time_based_control_start_time_setter).hour * 256 + id(t_time_based_control_start_time_setter).minute;
            ESP_LOGD("main", "###################### T Time Based Start Time: 0x%x", newStartTime);
            uint16_t newEndTime = id(t_time_based_control_end_time_setter).hour * 256 + id(t_time_based_control_end_time_setter).minute;
            ESP_LOGD("main", "###################### T Time Based End Time: 0x%x", newEndTime);
            uint32_t power = id(t_time_based_control_power_setter).state;
            ESP_LOGD("main", "###################### T Time Based Power: 0x%x", power);
            uint16_t endSOC = id(t_time_based_control_end_soc_setter).state;
            ESP_LOGD("main", "###################### T Time Based End SOC: 0x%x", endSOC);
            uint16_t endBattery = id(t_time_based_control_end_battery_voltage_setter).state * 10;
            ESP_LOGD("main", "###################### T Time Based End Battery: 0x%x", endBattery);
            uint16_t day = id(t_time_based_control_date_setter).day;
            uint16_t month = id(t_time_based_control_date_setter).month << 5;
            uint16_t year = (id(t_time_based_control_date_setter).year - 2020) << 9;  
            uint16_t date = year | month | day;
            ESP_LOGD("main", "###################### T Time Based Date: 0x%x", date);

            std::vector<uint16_t> timeBasedControlStructure;
            timeBasedControlStructure.reserve(8);
            timeBasedControlStructure.push_back(controls);
            timeBasedControlStructure.push_back(newStartTime);
            timeBasedControlStructure.push_back(newEndTime);
            uint16_t tmpPower = (power & 0xFFFF0000) >> 16;
            timeBasedControlStructure.push_back(tmpPower);
            tmpPower = power & 0xFFFF;
            timeBasedControlStructure.push_back(tmpPower);
            timeBasedControlStructure.push_back(endSOC);
            timeBasedControlStructure.push_back(endBattery);
            timeBasedControlStructure.push_back(date);

            esphome::modbus_controller::ModbusCommandItem set_payload_command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(inverter_modbus, (0x2600 + pos), 8, timeBasedControlStructure);
            inverter_modbus->queue_command(set_payload_command);
           
datetime:
# =========================
#  Generator work time control
# =========================
  - platform: template
    id: t_generator_start_time_setter
    type: time
    name: "${cat3} T Generator 1 Start time Setter"
    optimistic: yes
    
  - platform: template
    id: t_generator_end_time_setter
    type: time
    name: "${cat3} T Generator 2 End time Setter"
    optimistic: yes
 
# =========================
#  Time based control
# =========================
  - platform: template
    id: t_time_based_control_start_time_setter
    type: time
    name: "${cat3} T Time Based Control 10 Start Time Setter"
    optimistic: yes

  - platform: template
    id: t_time_based_control_end_time_setter
    type: time
    name: "${cat3} T Time Based Control 11 End Time Setter"
    optimistic: yes

  - platform: template
    id: t_time_based_control_date_setter
    type: date
    name: "${cat3} T Time Based Control 15 Date Setter"
    optimistic: yes


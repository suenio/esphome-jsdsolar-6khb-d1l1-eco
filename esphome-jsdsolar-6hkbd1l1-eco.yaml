  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: error_code_1
    name: "${cat2} Error Code 1"
    entity_category: DIAGNOSTIC
    address: 0x101E
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      static const uint8_t WARNINGS_SIZE = 16;
      static const char *const WARNINGS[WARNINGS_SIZE] = {
          "Inverter over  dc-bias current",                              // 0000 0000 0000 0001 
          "Inverrter relay abnormal",                                    // 0000 0000 0000 0010
          "Remote off",                                                  // 0000 0000 0000 0100 
          "Inverter over temperature",                                   // 0000 0000 0000 1000
          "Leakage current HCT (GFCI) abnormal",                         // 0000 0000 0001 0000
          "PV string reverse",                                           // 0000 0000 0010 0000
          "System type error",                                           // 0000 0000 0100 0000
          "Fan abnormal",                                                // 0000 0000 1000 0000 
          "DC-link unbalanced or under voltage",                         // 0000 0001 0000 0000
          "DC-link over voltage",                                        // 0000 0010 0000 0000 
          "Internal communication error",                                // 0000 0100 0000 0000 
          "Software incompatibility",                                    // 0000 1000 0000 0000
          "EEPROM error",                                                // 0001 0000 0000 0000 
          "Data inconsistency",                                          // 0010 0000 0000 0000 
          "Inverter abnormal",                                           // 0100 0000 0000 0000 
          "Boost abnormal",                                              // 1000 0000 0000 0000 
      };
      std::string values = "";
      uint16_t mask = modbus::helpers::word_from_hex_str(x, 0);
      if (mask) {
        for (int i = 0; i < WARNINGS_SIZE; i++) {
          if (mask & (1 << i)) {
            values.append(WARNINGS[i]);
            values.append(";");
          }
        }
        if (!values.empty()) {
          values.pop_back();
        }
      }
      if(values.length() == 0) values.append("No errors");
      return values;
  

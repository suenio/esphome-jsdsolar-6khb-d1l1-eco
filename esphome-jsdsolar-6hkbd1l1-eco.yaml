  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: dry_contact_status
    name: "${cat4} Dry Contact Status"
    entity_category: DIAGNOSTIC
    address: 0x313B
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      std::string values = "";
      uint16_t mask = modbus::helpers::word_from_hex_str(x, 0);
      uint16_t tmpMask = mask & 0b1;
      switch(tmpMask) {
        case 0b0:
          values.append("Dry Contct Off (Open)");
          break;
        case 0b1:
          values.append("Dry Contact On (Close)");
          break;        
      }
      values.append("; ");
            
      tmpMask = mask & 0b10;
      switch(tmpMask) {
        case 0b00:
          values.append("Generator Dry Contact Off (Open)");
          break;
        case 0b10:
          values.append("Generator Dry Contact On (Close)");
          break;        
      }
      values.append("; ");

      tmpMask = mask & 0b100;
      switch(tmpMask) {
        case 0b000:
          values.append("Smart load Dry Contact Off (Open)");
          break;
        case 0b100:
          values.append("Smart load Dry Contact On (Close)");
          break;        
      }
      values.append("; ");


      tmpMask = mask & 0b100000000000000;
      switch(tmpMask) {
        case 0b000000000000000:
          values.append("DI1 (Non-active)");
          break;
        case 0b100000000000000:
          values.append("DI1 (Active)");
          break;        
      }
      values.append("; ");

      tmpMask = mask & 0b1000000000000000;
      switch(tmpMask) {
        case 0b0000000000000000:
          values.append("Remote OFF (Non-active)");
          break;
        case 0b1000000000000000:
          values.append("Remote OFF (Active)");
          break;        
      }
      values.append("; ");

      return values;


# =========================
# 🌡 SYSTEM
# =========================
  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: inverter_inner_temperature
    name: "${cat2} Inverter Inner Temperature"
    entity_category: DIAGNOSTIC
    address: 0x101C
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"

# =========================
# ⚡ ENERGY
# =========================
  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: total_energy
    name: "${cat2} Total Energy"
    entity_category: DIAGNOSTIC
    address: 0x1021
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
  
  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: total_generation_time
    name: "${cat2} Total Generation Time"
    entity_category: DIAGNOSTIC
    address: 0x1023
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "hour(s)"
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: today_energy
    name: "${cat2} Today Energy"
    entity_category: DIAGNOSTIC
    address: 0x1027
    register_type: holding
    value_type: U_DWORD
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    
  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: grid_total_active_power
    name: "${cat2} Grid total Active Power"
    entity_category: DIAGNOSTIC
    address: 0x1037
    register_type: holding
    value_type: S_DWORD
    unit_of_measurement: "W"
    filters: 
      - multiply: 0.1 


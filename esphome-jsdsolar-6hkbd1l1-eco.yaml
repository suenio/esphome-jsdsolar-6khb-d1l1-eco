switch:
# =========================
#  Time based control
# =========================
  - platform: template
    id: t_time_based_control_weekly_monday
    name: "${cat3} T Time Based Control 03 Weekly (1) Monday"
    optimistic: true

  - platform: template
    id: t_time_based_control_weekly_tuesday
    name: "${cat3} T Time Based Control 04 Weekly (2) Tuesday"
    optimistic: true

  - platform: template
    id: t_time_based_control_weekly_wednesday
    name: "${cat3} T Time Based Control 05 Weekly (3) Wednesday"
    optimistic: true

  - platform: template
    id: t_time_based_control_weekly_thursday
    name: "${cat3} T Time Based Control 06 Weekly (4) Thursday"
    optimistic: true

  - platform: template
    id: t_time_based_control_weekly_friday
    name: "${cat3} T Time Based Control 07 Weekly (5) Friday"
    optimistic: true

  - platform: template
    id: t_time_based_control_weekly_saturday
    name: "${cat3} T Time Based Control 08 Weekly (6) Saturday"
    optimistic: true

  - platform: template
    id: t_time_based_control_weekly_sunday
    name: "${cat3} T Time Based Control 09 Weekly (7) Sunday"
    optimistic: true

# =========================
#  Inverter params
# ========================= 
  - platform: modbus_controller   #ok inverter on/off remote button
    modbus_controller_id: inverter_modbus
    name: "${cat4} Inverter Power"
    address: 0x6001
    register_type: holding
    bitmask: 0x0001
    #inverted: true
    lambda: "return !x;"
    write_lambda: |-
      return !x;

  - platform: modbus_controller   #ok inverter settings -> Charge From Grid       or      settings -> QuickSettings(2) -> Charge From Grid                          
    modbus_controller_id: inverter_modbus
    id: charge_from_grid
    name: "${cat3} Charge from Grid"
    entity_category: config
    register_type: holding    
    address: 0x2115
    bitmask: 0x0001

  - platform: modbus_controller                                   

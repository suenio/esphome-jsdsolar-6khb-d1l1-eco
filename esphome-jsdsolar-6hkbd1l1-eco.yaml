text_sensor:
# =========================
# 🌡 SYSTEM
# =========================
  - platform: modbus_controller
    modbus_controller_id: inverter_modbus
    id: system_work_status
    name: "${cat2} System Work Status"
    entity_category: DIAGNOSTIC
    address: 0x104A
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      std::string values = "";
      uint16_t mask = modbus::helpers::word_from_hex_str(x, 0);
      uint16_t tmpMask = mask & 0b111;
      switch(tmpMask) {
        case 0b000:
          values.append("Power On");
          break;
        case 0b001:
          values.append("Standby");
          break;
        case 0b011:
          values.append("On Grid");
          break;
        case 0b100:
          values.append("Off Grid");
          break;
      }
      values.append("; ");
            
      tmpMask = mask & 0b1000;
      switch(tmpMask) {
        case 0b0000:
          values.append("Backup R-Off");
          break;
        case 0b1000:
          values.append("Backup R-On");
          break;        
      }
      values.append("; ");
            
      tmpMask = mask & 0b110000;
      switch(tmpMask) {
        case 0b000000:
          values.append("Battery Reserved");
          break;
        case 0b010000:
          values.append("Battery Charging");
          break;    
        case 0b100000:
          values.append("Battery DisCharging");
          break;
        case 0b110000:
          values.append("Battery Full charge");
          break;     
      }
      values.append("; ");
      
      tmpMask = mask & 0b1000000;
      switch(tmpMask) {
        case 0b0000000:
          values.append("PV Normal");
          break;
        case 0b1000000:
          values.append("PV Failure");
          break;        
      }
      values.append("; ");
      
      tmpMask = mask & 0b10000000;
      switch(tmpMask) {
        case 0b00000000:
          values.append("Grid Normal");
          break;
        case 0b10000000:
          values.append("Grid Failure");
          break;        
      }
      values.append("; ");

      tmpMask = mask & 0b11000000000;
      switch(tmpMask) {
        case 0b00000000000:
          values.append("GEN - Off");
          break;
        case 0b01000000000:
          values.append("GEN - Generator");
          break;    
        case 0b10000000000:
          values.append("GEN - Smart load");
          break;
        case 0b11000000000:
          values.append("GEN - Inverter");
          break;     
      }
      values.append("; ");

      tmpMask = mask & 0b100000000000;
      switch(tmpMask) {
        case 0b000000000000:
          values.append("Generator R-Off");
          break;
        case 0b100000000000:
          values.append("Generator R-On");
          break;        
      }
      values.append("; ");

      return values;

